name: Main

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pip:
    name: Publish to Pip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install pypa/build
        working-directory: python
        run: python -m pip install build --user

      - name: Install deps
        working-directory: python
        run: pip install .[test]

      - name: Run unit tests
        working-directory: python
        run: pytest

      - name: Build a binary wheel and a source tarball
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: python
        env:
          VERSION: ${{ github.ref_name }}
        run: python -m build --sdist --wheel --outdir dist/ .

      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          packages-dir: python/dist

  npm:
    name: Publish to Npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Get OIDC Token
        env:
          AUDIENCE: "npm:registry.npmjs.org"
        run: |
          TOKEN_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          echo "NODE_AUTH_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      # Trusted publishing need npm 11.+
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm version

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        id: set_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Copy Readme
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: javascript
        run: |
          curl -s https://raw.githubusercontent.com/kestra-io/kestra/master/README.md > README.md
          npm version "$VERSION" --no-git-tag-version

      - name: Install dependencies
        working-directory: javascript
        run: npm install

      - name: Run unit tests
        working-directory: javascript
        run: npm run test

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: javascript
        run: npm publish --access public


  r:
    name: Check R package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The version comes from the release tag, like the Python and npm packages.
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: r
        run: |
          sed -i "s/^Version: .*/Version: ${GITHUB_REF_NAME#v}/" DESCRIPTION

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual")'
          error-on: '"warning"'

  powershell:
    name: Test PowerShell module (${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          # Windows PowerShell 5.1, which the module supports
          - os: windows-latest
            shell: powershell
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: powershell
    steps:
      - uses: actions/checkout@v6

      # The version comes from the release tag, like the Python and npm packages.
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $manifest = './Kestra/Kestra.psd1'
          (Get-Content $manifest -Raw) -replace "ModuleVersion\s*=\s*'[^']*'", "ModuleVersion     = '$($env:GITHUB_REF_NAME.TrimStart('v'))'" | Set-Content $manifest -NoNewline

      - name: Install test tools
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser

      - name: Lint
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./Kestra -Recurse -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Test
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -CI

  go:
    name: Test Go module (${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', 'stable']
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  ruby:
    name: Test Ruby gem (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.4']
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Test
        run: ruby -w -Ilib test/kestra_test.rb

      - name: Build gem
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
        run: gem build kestra.gemspec

  php:
    name: Test PHP library (${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', 'latest']
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: php -l src/Kestra.php

      - name: Test
        run: php tests/KestraTest.php

  perl:
    name: Test Perl module (${{ matrix.perl }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 5.36 is the first version with native booleans.
        perl: ['5.26', '5.36', 'latest']
    container: perl:${{ matrix.perl }}
    defaults:
      run:
        working-directory: perl
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: prove -lv t

  groovy:
    name: Test Groovy class (${{ matrix.groovy }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        groovy: ['3.0-jdk11', '4.0-jdk17', 'latest']
    container:
      image: groovy:${{ matrix.groovy }}
      # The image runs as the groovy user, which cannot write the checkout.
      options: --user root
    defaults:
      run:
        working-directory: groovy
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: groovy test/KestraTest.groovy

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - pip
      - npm
      - r
      - powershell
      - go
      - ruby
      - php
      - perl
      - groovy
    steps:
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  end:
    runs-on: ubuntu-latest
    needs:
      - release
    if: failure()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # Slack
      - name: Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != 0 }}
        uses: kestra-io/actions/composite/slack-status@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: 'C09FF36GKE1'

