name: Tag version

on:
  workflow_dispatch:
    inputs:
      new_version:
        type: string
        required: true
        description: The version to tag

jobs:
  tag-version:
    name: Tag version
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Resolve incoming version
        id: resolve-version
        run: |
          set -euo pipefail

          NEW_KESTRA_VER="${{ inputs.new_version }}"

          if [ -z "${NEW_KESTRA_VER}" ]; then
            echo "No new version provided — failing workflow."
            exit 1
          fi

          echo "NEW_KESTRA_VER=${NEW_KESTRA_VER}" >> $GITHUB_ENV
          echo "Incoming version: ${NEW_KESTRA_VER}"

      - name: Validate Kestra version format
        id: validate-format
        run: |
          set -euo pipefail

          if [[ ! "${NEW_KESTRA_VER}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Kestra version '${NEW_KESTRA_VER}' is invalid. Must be in format vX.Y.Z (e.g., v1.2.3)."
            exit 1
          fi

          echo "Kestra version format valid: ${NEW_KESTRA_VER}"

      - name: Checkout branch
        uses: kestra-io/actions/composite/checkout-and-auth@main
        with:
          gh-app-id: ${{ secrets.GH_BOT_APP_ID }}
          gh-app-private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          ref: main

      - name: Read versions and create missing tag
        id: read-latest
        run: |
          set -euo pipefail

          # Ensure we have tags locally
          git fetch --tags --prune

          # Configure git author for tagging
          git config user.email "actions@github.com"
          git config user.name "tag-versioning-wf"

          # Go resolves the module in go/ only from tags prefixed with its directory.
          # Each tag is checked exactly, so a rerun creates whichever one a failed run left out.
          TAGS=()
          for TAG in "${NEW_KESTRA_VER}" "go/${NEW_KESTRA_VER}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists on remote."
            else
              git tag -a "${TAG}" -m "Automated tag for: ${TAG}"
              TAGS+=("${TAG}")
            fi
          done

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "Nothing to do."
            exit 0
          fi
          git push --atomic origin "${TAGS[@]}"

          echo "Pushed ${TAGS[*]}."
